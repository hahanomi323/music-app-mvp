services:
  - type: web
    name: music-app-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: music-app-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 4000
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: music-app-db
    databaseName: musicapp
    plan: free
